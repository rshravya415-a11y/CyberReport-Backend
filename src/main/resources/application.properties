spring.application.name=Cyber_report
server.port=${PORT:8080}

# ─── Database Configuration ──────────────────────────────────────────────────
# 1. External MySQL (Railway / Render env vars / Localhost MySQL):
#    Set SPRING_DATASOURCE_URL, DATABASE_URL, or MYSQLHOST
# 2. Render Free fallback:
#    If no MySQL credentials are provided, automatically uses an embedded file database
#    so the app NEVER crashes with socket connection errors!
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/cyberreport;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:sa}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Multipart (evidence uploads) ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Error responses ─────────────────────────────────────────────────────────
server.error.include-message=always

# ─── Session (for auth) ───────────────────────────────────────────────────────
server.servlet.session.timeout=24h
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
